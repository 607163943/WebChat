# tomcat
server:
  port: 8000
# spring
spring:
  application:
    name: webchat-server
  # 本地敏感配置（QWEN_API_KEY）写在已 gitignore 的 .env 里，Spring Boot 不会自动读，需显式导入
  config:
    import: optional:file:./.env[.properties]
  # 不配这段的话默认只有 1MB / 10MB：任何超过 1MB 的文件在参数解析阶段就抛
  # MaxUploadSizeExceededException，根本进不到 AttachmentService 的校验代码里
  servlet:
    multipart:
      max-file-size: 10MB
      # 一次请求只带一个文件（选出多个时逐个上传、各自拿一个附件 id），留足边界与表单字段的余量
      max-request-size: 16MB
  datasource:
    username: root
    password: webchat123
    # 容器本身跑在 UTC（docker exec webchat-mysql date → UTC），若只写 serverTimezone 只影响驱动解读、
    # 不会改服务端会话时区，create_time/update_time 会按 UTC 落库，比本地时间少 8 小时。
    # forceConnectionTimeZoneToSession 让驱动在连接时执行 SET SESSION time_zone，使 NOW() 与数据库默认值走北京时间。
    url: jdbc:mysql://192.168.150.101:3306/webchat?useUnicode=true&characterEncoding=utf-8&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true
    driver-class-name: com.mysql.cj.jdbc.Driver
langchain4j:
  community:
    dashscope:
      embedding-model:
        # 模型名不能随手换：QwenEmbeddingModel 调用后会按返回项的 text_index 排序，而 SDK 只认这个
        # 字段名。qwen3.7-text-embedding-flash 返回的是 index，取到 null 会让 Comparator.comparing
        # 抛 NPE——表现是「切出两段以上的文档全都索引失败」，单段小文件却没事，很难往这里想。
        # v4 在同一个端点上返回的正是 text_index，实测 1MB / 874 段可正常索引
        model-name: text-embedding-v4
        api-key: ${CHAT_MODEL_API_KEY}
      chat-model:
        api-key: ${CHAT_MODEL_API_KEY}
        model-name: qwen3.8-max
      # 流式模型是独立的配置前缀，不配这段就不会有 StreamingChatModel bean
      streaming-chat-model:
        api-key: ${CHAT_MODEL_API_KEY}
        model-name: qwen3.8-max
# 附件：本地磁盘存储 + 多模态输入的相关上限。绑定与初始化见 config/AttachmentProperties
webchat:
  attachment:
    # 相对路径按后端进程的工作目录解析
    dir: ./data/attachments
    max-file-size: 10MB
    # 文本文件单独收紧：它要切分后逐段调 embedding，成本随体量线性上升（1MB 中文约 35 万 token，
    # 而模型的 TPM 是 100 万）。图片视频没有这个问题，它们是整块塞进一次请求的
    max-text-file-size: 1MB
    max-files-per-message: 5
    # 整轮请求发给模型的媒体总量（base64 编码前）。只限个数不够：5 个 10MB 的文件编码后是 ~67MB
    max-request-media-size: 20MB
    # 未绑定附件的存活时长；调试清理任务时可临时改成 0s，那时未绑定的附件立刻成为候选
    unbound-ttl: 24h
    # 清理任务的扫描间隔，同时用作首次执行的延迟（@Scheduled 接受 30m 这种简单写法）
    cleanup-interval: 30m
    retry-alert-threshold: 5
  # 联网搜索：把 Exa 的 MCP 服务接成一组模型可自主调用的工具（web_search_exa / web_fetch_exa）。
  # 连接是懒建的——没配密钥、Exa 不通都不影响启动与其余功能，只是模型手上没有工具
  search:
    # 关掉即可整体停用，不必删密钥
    enabled: true
    # 密钥走查询参数发给 MCP 服务（Exa 只认这个参数），所以拼出来的 URL 不能进日志
    api-key: ${MCP_SEARCH_API_KEY:}
    # 其余可调项（端点、工具白名单、超时）用 SearchProperties 里的默认值
  # 文本附件的检索（RAG）。纯内存向量库，重启即失效，已绑定的附件要重新上传才有检索
  rag:
    max-results: 5
    # 注意这不是余弦值：RelevanceScore = (cos + 1) / 2，所以 0.7 对应余弦 0.4。
    # 按余弦的直觉填 0.5 是个陷阱——那等于「余弦 ≥ 0」，几乎什么都放行。
    # 实测的两份小文档：与问题相关的那段落在 0.81~0.83，不相关的落在 0.7 以下
    min-score: 0.7
    chunk-size: 1200
    chunk-overlap: 200
    # 单个文档的片段数上限，对上「你这个文件太大」这个归因。按当前参数它还够不到：切分步长
    # 实测是 chunk-size 本身，1MB 纯 ASCII 约 874 段、中文约 350 段。它挡的是日后放宽文本大小
    # 上限或调小 chunk-size 之后的情况——没有它，一个超大文件能一口气吃掉全库预算
    max-segments-per-document: 1000
    # 整个向量库的片段总数上限，约合 60MB 堆。超过后新文档不再索引，只记一条 warn。
    # 注意它与上面那条是两回事：撞上它说明库已被别的文件占满，与当前这个文件大不大无关
    max-total-segments: 10000
    # 检索在回复的关键路径上，而 SSE 没有心跳事件，超时就当作没检索到
    retrieval-timeout: 3s
# springdoc：让导出的 openapi.json 逐字节稳定，否则每次重新生成 git diff 都是噪音
springdoc:
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true